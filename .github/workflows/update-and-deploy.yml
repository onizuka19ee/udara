name: Update IPU and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: udara-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check data logic
        run: node --test tests/core.test.mjs
      - name: Retrieve official readings
        id: refresh
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Report source failure
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::DOE fetch failed. Publishing the last saved snapshot with its original timestamps. Check the official source and retry the workflow.'
      - name: Preserve observations
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official IPU observations'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html style.css app.mjs core.mjs icon.svg _site/
          cp data/latest.json _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
